name: Dependency Updates

on:
  schedule:
    - cron: '0 8 * * MON'  # Weekly on Monday at 8 AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Update dependencies
      run: |
        bundle update --conservative
        
    - name: Run tests
      run: |
        bundle install
        bundle exec rspec
        bundle exec rubocop --parallel

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "deps: update gem dependencies"
        title: "🔄 Weekly dependency updates"
        body: |
          ## Automated Dependency Updates
          
          This PR updates gem dependencies to their latest compatible versions.
          
          ### Changes
          - Updates all gems within semver constraints
          - Maintains compatibility with supported Ruby/Rails versions
          - All tests passing ✅
          
          ### Testing
          - ✅ RSpec test suite passes
          - ✅ RuboCop linting passes
          - ✅ Configuration validation passes
          
          **Auto-generated by GitHub Actions**
        branch: deps/weekly-update
        delete-branch: true
