name: Release (Manual)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        # No dependency cache in the release workflow (cache-poisoning hardening).
        bundler-cache: false

    - name: Install dependencies
      run: bundle install

    - name: Run full test suite
      run: bundle exec rspec

    - name: Run RuboCop
      run: bundle exec rubocop --parallel

  build-and-publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write  # create the GitHub Release
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        # No dependency cache in the publish job (cache-poisoning hardening).
        bundler-cache: false

    - name: Extract version from tag
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Check if version already published
      id: check_version
      env:
        VERSION: ${{ steps.extract_version.outputs.VERSION }}
      run: |
        if gem search rubocop-hk --versions --exact | grep -q "$VERSION"; then
          echo "already_published=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already published (likely by auto-release)"
        else
          echo "already_published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build gem
      if: steps.check_version.outputs.already_published == 'false'
      run: |
        gem build rubocop-hk.gemspec
        ls -la *.gem

    - name: Test gem installation
      if: steps.check_version.outputs.already_published == 'false'
      run: |
        gem install ./rubocop-hk-*.gem
        ruby -e "require 'rubocop/hk'; puts Rubocop::Hk::VERSION"

    - name: Publish to RubyGems
      if: steps.check_version.outputs.already_published == 'false'
      env:
        GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
      run: |
        mkdir -p ~/.gem
        echo "---" > ~/.gem/credentials
        echo ":rubygems_api_key: $GEM_HOST_API_KEY" >> ~/.gem/credentials
        chmod 600 ~/.gem/credentials
        gem push rubocop-hk-*.gem --verbose

    - name: Create GitHub Release
      if: steps.check_version.outputs.already_published == 'false'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: |
          rubocop-hk-*.gem
        generate_release_notes: true
        make_latest: true

    - name: Skip notice
      if: steps.check_version.outputs.already_published == 'true'
      run: echo "Skipped - version already published by auto-release in CI"
